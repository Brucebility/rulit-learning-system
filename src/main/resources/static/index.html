<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rulit 智能学习辅助系统</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div class="brand-text">
        <strong>Rulit</strong>
        <small>智能学习辅助系统</small>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dept">
        <span class="nav-icon">🏢</span>
        <span>部门管理</span>
      </button>
      <button class="nav-item" data-view="emp">
        <span class="nav-icon">👤</span>
        <span>员工管理</span>
      </button>
      <button class="nav-item" data-view="upload">
        <span class="nav-icon">☁️</span>
        <span>文件上传</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <span class="dot"></span>
      <span id="api-state">后端已连接</span>
    </div>
  </aside>

  <main class="main">
    <!-- ==================== 部门管理 ==================== -->
    <section class="view active" id="view-dept">
      <header class="page-head">
        <div>
          <h1>部门管理</h1>
          <p class="sub">维护组织架构中的部门信息</p>
        </div>
        <button class="btn btn-primary" id="dept-add">新增部门</button>
      </header>

      <div class="card">
        <table class="table">
          <thead>
          <tr>
            <th style="width:80px">ID</th>
            <th>部门名称</th>
            <th>创建时间</th>
            <th>修改时间</th>
            <th style="width:160px">操作</th>
          </tr>
          </thead>
          <tbody id="dept-tbody">
          <tr><td colspan="5" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ==================== 员工管理 ==================== -->
    <section class="view" id="view-emp">
      <header class="page-head">
        <div>
          <h1>员工管理</h1>
          <p class="sub">支持姓名、性别、入职日期区间组合筛选与分页</p>
        </div>
        <button class="btn btn-primary" id="emp-add">新增员工</button>
      </header>

      <form class="card filters" id="emp-filter">
        <label>
          <span>姓名</span>
          <input type="text" name="name" placeholder="支持模糊查询">
        </label>
        <label>
          <span>性别</span>
          <select name="gender">
            <option value="">全部</option>
            <option value="1">男</option>
            <option value="2">女</option>
          </select>
        </label>
        <label>
          <span>入职日期</span>
          <input type="date" name="begin">
        </label>
        <label class="dash">
          <span>至</span>
          <input type="date" name="end">
        </label>
        <div class="filter-actions">
          <button type="submit" class="btn btn-primary">查询</button>
          <button type="reset" class="btn btn-ghost" id="emp-reset">重置</button>
        </div>
      </form>

      <div class="card">
        <table class="table">
          <thead>
          <tr>
            <th style="width:70px">ID</th>
            <th>用户名</th>
            <th>姓名</th>
            <th style="width:70px">性别</th>
            <th>职位</th>
            <th>部门</th>
            <th>入职日期</th>
            <th>薪资</th>
          </tr>
          </thead>
          <tbody id="emp-tbody">
          <tr><td colspan="8" class="empty">加载中…</td></tr>
          </tbody>
        </table>

        <div class="pager">
          <span id="emp-total">共 0 条</span>
          <div class="pager-controls">
            <button class="btn btn-ghost btn-sm" id="emp-prev">上一页</button>
            <span id="emp-page">1 / 1</span>
            <button class="btn btn-ghost btn-sm" id="emp-next">下一页</button>
            <select id="emp-size">
              <option value="5">5 条/页</option>
              <option value="10" selected>10 条/页</option>
              <option value="20">20 条/页</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== 文件上传 ==================== -->
    <section class="view" id="view-upload">
      <header class="page-head">
        <div>
          <h1>文件上传</h1>
          <p class="sub">上传文件到阿里云 OSS，返回可访问 URL</p>
        </div>
      </header>

      <div class="card upload-card">
        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" hidden>
          <div class="dropzone-icon">⬆️</div>
          <p>点击选择文件，或将文件拖到这里</p>
          <small>支持任意类型，单个文件</small>
        </div>
        <div class="upload-result" id="upload-result" hidden>
          <p class="label">上传成功，返回地址：</p>
          <a id="upload-url" href="#" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ==================== 弹窗：部门 ==================== -->
<div class="modal" id="dept-modal" hidden>
  <div class="modal-box">
    <h2 id="dept-modal-title">新增部门</h2>
    <label class="field">
      <span>部门名称</span>
      <input type="text" id="dept-name" maxlength="20" placeholder="例如：教研部">
    </label>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="dept-modal">取消</button>
      <button class="btn btn-primary" id="dept-save">保存</button>
    </div>
  </div>
</div>

<!-- ==================== 弹窗：员工 ==================== -->
<div class="modal" id="emp-modal" hidden>
  <div class="modal-box wide">
    <h2>新增员工</h2>
    <div class="grid-2">
      <label class="field">
        <span>用户名</span>
        <input type="text" id="emp-username" placeholder="登录用户名">
      </label>
      <label class="field">
        <span>姓名</span>
        <input type="text" id="emp-name" placeholder="真实姓名">
      </label>
      <label class="field">
        <span>性别</span>
        <select id="emp-gender">
          <option value="1">男</option>
          <option value="2">女</option>
        </select>
      </label>
      <label class="field">
        <span>手机号</span>
        <input type="text" id="emp-phone" maxlength="11" placeholder="11 位手机号">
      </label>
      <label class="field">
        <span>职位</span>
        <select id="emp-job">
          <option value="1">班主任</option>
          <option value="2">讲师</option>
          <option value="3">学工主管</option>
          <option value="4">教研主管</option>
          <option value="5">咨询师</option>
        </select>
      </label>
      <label class="field">
        <span>部门</span>
        <select id="emp-dept"></select>
      </label>
      <label class="field">
        <span>入职日期</span>
        <input type="date" id="emp-entry">
      </label>
      <label class="field">
        <span>薪资</span>
        <input type="number" id="emp-salary" min="0" placeholder="月薪">
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="emp-modal">取消</button>
      <button class="btn btn-primary" id="emp-save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
