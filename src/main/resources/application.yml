spring:
  application:
    name: tlias
  # 数据库连接：全部通过环境变量注入，不要把真实密码写进本文件
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tlias}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true

# 事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 阿里云 OSS（可选，仅文件上传功能需要）
# 上传凭证由 SDK 从环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 读取
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket-name: ${OSS_BUCKET_NAME:}
    region: ${OSS_REGION:}
